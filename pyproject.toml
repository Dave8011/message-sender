[project]
name = "message-sender"
version = "1.0.0"
description = "WhatsApp Bulk Sender & Webhook Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "requests>=2.31.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "phonenumbers>=8.13.0",
    "python-multipart>=0.0.9",
    "python-telegram-bot>=21.0",
]

[tool.vercel]
entrypoint = "webhook:app"
